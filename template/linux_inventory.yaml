        - uuid: 10743eb915fd4ba0832c2eac049c6a21
          name: 'Network: virtual interfaces (source)'
          type: ZABBIX_ACTIVE
          key: 'vfs.dir.get[/sys/devices/virtual/net,^(uevent|bridge|tun_flags)$,,,,1,,,,,^(veth|cali)]'
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          description: 'Интерфейсы из /sys/devices/virtual/net с маркерами: uevent — виртуальный, bridge — мост, tun_flags — tun/tap. Строки «имя маркеры»; veth* и cali* не обходятся. Источник swinv.net.ifaces.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d, marks = {};
                  try { d = JSON.parse(value); } catch (e) { throw 'vfs.dir.get did not return JSON: ' + e; }
                  if (!Array.isArray(d)) { throw 'vfs.dir.get did not return a JSON array'; }
                  d.forEach(function (e) {
                    var m = String(e.pathname).match(/^\/sys\/devices\/virtual\/net\/([^\/]+)\/(uevent|bridge|tun_flags)$/);
                    if (m) { (marks[m[1]] = marks[m[1]] || []).push(m[2]); }
                  });
                  if (!marks.lo) { throw 'lo is missing from /sys/devices/virtual/net: unexpected vfs.dir.get output'; }
                  return Object.keys(marks).sort().map(function (k) { return k + ' ' + marks[k].sort().join(' '); }).join('\n');
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: class
              value: inventory
        - uuid: 80bc603202fc429bb100db86093eb3c9
