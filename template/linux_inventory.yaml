      discovery_rules:
        - uuid: f20a76e4e17249b2a975029b2a1f5f15
          name: 'Tracked software discovery'
          type: DEPENDENT
          key: swpkg.lld
          delay: '0'
          filter:
            conditions:
              - macro: '{#PKG.NAME}'
                value: '{$SWINV.APPS}'
                formulaid: A
          description: 'Пакеты из мастера system.sw.packages.get[.*], имя которых совпадает с {$SWINV.APPS}; на каждый — итем версии. Удалённый пакет уходит по истечении lifetime.'
          item_prototypes:
            - uuid: 14bf07f3da714ef5a0b70f7ebabd0538
              name: 'Version: {#PKG.NAME}'
              type: DEPENDENT
              key: 'swpkg.ver[{#PKG.NAME}]'
              delay: '0'
              history: 90d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$[?(@.name=="{#PKG.NAME}")].version.first()'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: 'not installed'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 12h
              master_item:
                key: 'system.sw.packages.get[.*]'
              tags:
                - tag: app
                  value: '{#PKG.NAME}'
                - tag: component
                  value: software-version
                - tag: manager
                  value: '{#PKG.MANAGER}'
          master_item:
            key: 'system.sw.packages.get[.*]'
          lld_macro_paths:
            - lld_macro: '{#PKG.ARCH}'
              path: $.arch
            - lld_macro: '{#PKG.MANAGER}'
              path: $.manager
            - lld_macro: '{#PKG.NAME}'
              path: $.name
            - lld_macro: '{#PKG.VERSION}'
              path: $.version
      tags:
        - tag: class
          value: inventory
      macros:
        - macro: '{$SWINV.APPS}'
          value: '^(containerd\.io|mariadb-server|mysql-server|mysql-community-server|mssql-server|postgresql-1[0-9]|redis-server|php-fpm|php[0-9.]+-fpm|mongodb(-org)?-server|apache2|httpd|haproxy|postfix|unbound|fail2ban|fail2ban-server|nodejs|vector|openvpn|strongswan|wireguard-tools)$'
          description: 'Regex имён пакетов для LLD «Tracked software discovery». nginx, openssl, openssh-server и docker-ce — статические итемы, в макрос их не добавлять: будут дубли.'
        - macro: '{$SWINV.IF.NOT_MATCHES}'
          value: '^(lo|docker[0-9]*|veth.*|br-.*|virbr.*|cali.*|flannel.*|cni.*)$'
          description: 'Интерфейсы, чьи MAC не попадают в swinv.net.mac и inventory macaddress_a: loopback и виртуальные сети контейнеров.'
        - macro: '{$SWINV.IP.NOT_MATCHES}'
          value: '^(127[.]|172[.](1[7-9]|2[0-9]|3[01])[.]0[.]1$)'
          description: 'IPv4-адреса, которые не попадают в swinv.net.ip4 и inventory host_networks: loopback и шлюзы мостов Docker из стандартных пулов (172.17–31.0.0/16, адрес .0.1). Эвристика: в fib_trie нет имён интерфейсов. Мост с нестандартной подсетью (например 172.22.1.1) останется — добавьте его сюда. Точку пишите как [.]: макрос подставляется в JS-строку, где \. теряет обратный слеш; реальный адрес вида 172.2x.0.1 на хосте — уберите диапазон из макроса на уровне хоста.'
        - macro: '{$SWINV.NODATA}'
          value: 30h
          description: 'Окно триггера «манифест не обновляется». Мастер-итем опрашивается раз в час и отдаёт значение вниз при изменении или по heartbeat 12h, поэтому здоровый хост молчит не дольше ~13h. 30h — с запасом на недоступность агента; окно можно снизить до ~14h.'
        - macro: '{$SWINV.SRC.NODATA}'
          value: 14h
          description: 'Если у источника swinv.net.ifaces или swinv.hw нет новых данных дольше этого окна, элемент уходит в not supported, а не отдаёт старое значение. Источники опрашиваются раз в час (оборудование — раз в 12 часов), неизменное значение повторяется раз в 12 часов.'
