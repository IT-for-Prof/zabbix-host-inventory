        - uuid: 5825936d31f240e39faf2419247c384f
          name: 'Network: interface names (source)'
          type: ZABBIX_ACTIVE
          key: 'vfs.file.contents[/proc/net/dev]'
          delay: 1h
          history: 7d
          value_type: TEXT
          trends: '0'
          description: 'Имена всех интерфейсов из /proc/net/dev, по строке; источник swinv.net.ifaces.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var out = [];
                  value.split('\n').slice(2).forEach(function (l) {
                    var m = l.match(/^\s*([^:\s]+):/);
                    if (m) { out.push(m[1]); }
                  });
                  if (!out.length) { throw 'no interfaces in /proc/net/dev'; }
                  return out.sort().join('\n');
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 12h
          tags:
            - tag: class
              value: inventory
